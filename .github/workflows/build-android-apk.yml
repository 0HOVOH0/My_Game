name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-apk-actions

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GraalVM built by Gluon
        uses: gluonhq/setup-graalvm@master
        with:
          graalvm: '22.1.0.1-Final'
          jdk: 'java17'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build and package APK
        run: ./mvnw -B -Pandroid gluonfx:build gluonfx:package

      - name: Dump Gluon logs on failure
        if: failure()
        run: |
          echo "=== target/gluonfx/log ==="
          if [ -d target/gluonfx/log ]; then
            for log in target/gluonfx/log/*; do
              [ -f "$log" ] || continue
              echo "--- $log ---"
              tail -n 240 "$log" || true
            done
          fi
          echo "=== target/gluonfx/aarch64-android/gvm/log ==="
          if [ -d target/gluonfx/aarch64-android/gvm/log ]; then
            for log in target/gluonfx/aarch64-android/gvm/log/*; do
              [ -f "$log" ] || continue
              echo "--- $log ---"
              tail -n 240 "$log" || true
            done
          fi

      - name: Upload Gluon logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gluon-android-build-logs
          path: |
            target/gluonfx/log
            target/gluonfx/aarch64-android/gvm/log
          if-no-files-found: ignore

      - name: Stage APK
        run: |
          mkdir -p staging
          cp -r target/gluonfx/aarch64-android/gvm/*.apk staging/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-game-android-apk
          path: staging
          if-no-files-found: error
