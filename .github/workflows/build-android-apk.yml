name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-apk-actions

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GraalVM built by Gluon
        uses: gluonhq/setup-graalvm@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build and package APK
        run: ./mvnw -B -Pandroid gluonfx:build gluonfx:package

      - name: Stage APK
        run: |
          mkdir -p staging
          cp -r target/gluonfx/aarch64-android/gvm/*.apk staging/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-game-android-apk
          path: staging
          if-no-files-found: error
