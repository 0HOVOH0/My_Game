name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-apk-actions

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GraalVM built by Gluon
        uses: gluonhq/setup-graalvm@master
        with:
          graalvm: '22.1.0.1-Final'
          jdk: 'java17'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build and package APK
        run: ./mvnw -B -Pandroid gluonfx:build gluonfx:package


      - name: Dump Gluon logs on failure
        if: failure()
        run: |
          echo "=== target/gluonfx/log ==="
          find target/gluonfx/log -type f -maxdepth 1 -print -exec sh -c 'echo "---       - name: Stage APK ---"; tail -n 240 "      - name: Stage APK"' _ {} \; || true
          echo "=== target/gluonfx/aarch64-android/gvm/log ==="
          find target/gluonfx/aarch64-android/gvm/log -type f -print -exec sh -c 'echo "---       - name: Stage APK ---"; tail -n 240 "      - name: Stage APK"' _ {} \; || true
      - name: Stage APK
        run: |
          mkdir -p staging
          cp -r target/gluonfx/aarch64-android/gvm/*.apk staging/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-game-android-apk
          path: staging
          if-no-files-found: error




